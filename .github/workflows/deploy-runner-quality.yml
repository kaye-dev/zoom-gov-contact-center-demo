name: Deploy runner quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-runner-npm-test:
    name: Deploy runner npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build, test, typecheck, and audit the immutable deploy runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              [[ "${GITHUB_REF}" =~ ^refs/pull/[0-9]+/merge$ ]]
              ;;
            push)
              [[ "${GITHUB_REF}" == "refs/heads/main" ]]
              ;;
            *)
              echo "Unexpected GitHub event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          command -v docker >/dev/null
          docker version >/dev/null
          build_context="$(mktemp -d "${RUNNER_TEMP:?}/zoom-deploy-quality.XXXXXX")"
          [[ -d "${build_context}" && ! -L "${build_context}" ]]
          git archive --format=tar "${GITHUB_SHA}" | tar -xf - -C "${build_context}"
          [[ -f "${build_context}/Dockerfile.deploy" && ! -L "${build_context}/Dockerfile.deploy" ]]
          image="zoom-gov-contact-center-demo-deploy:${GITHUB_SHA}"
          docker build \
            --file "${build_context}/Dockerfile.deploy" \
            --build-arg "DEPLOY_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "DEPLOY_GIT_BRANCH=ci/${GITHUB_EVENT_NAME}" \
            --tag "${image}" \
            "${build_context}"
          docker run --rm --init --network none \
            --entrypoint npm \
            "${image}" \
            test
          docker run --rm --init --network none \
            --entrypoint npm \
            "${image}" \
            run typecheck

          resource_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "${resource_suffix}" =~ ^[0-9]+-[0-9]+$ ]]
          [[ ${#resource_suffix} -le 32 ]]
          migration_network="zoom-migration-schema-${resource_suffix}"
          migration_database="zoom-migration-schema-db-${resource_suffix}"
          migration_owner="github-actions-${resource_suffix}"
          migration_owner_label="dev.keien.migration-schema-owner"

          cleanup_owned_migration_resources() {
            local cleanup_status=0
            local actual_owner
            if docker container inspect "${migration_database}" >/dev/null 2>&1; then
              actual_owner="$(docker container inspect \
                --format '{{ index .Config.Labels "dev.keien.migration-schema-owner" }}' \
                "${migration_database}")"
              if [[ "${actual_owner}" != "${migration_owner}" ]]; then
                echo "Refusing to remove an unowned migration schema container." >&2
                cleanup_status=1
              elif ! docker rm --force "${migration_database}" >/dev/null; then
                cleanup_status=1
              fi
            fi
            if docker network inspect "${migration_network}" >/dev/null 2>&1; then
              actual_owner="$(docker network inspect \
                --format '{{ index .Labels "dev.keien.migration-schema-owner" }}' \
                "${migration_network}")"
              if [[ "${actual_owner}" != "${migration_owner}" ]]; then
                echo "Refusing to remove an unowned migration schema network." >&2
                cleanup_status=1
              elif ! docker network rm "${migration_network}" >/dev/null; then
                cleanup_status=1
              fi
            fi
            return "${cleanup_status}"
          }

          cleanup_on_exit() {
            local command_status=$?
            local cleanup_status=0
            trap - EXIT
            cleanup_owned_migration_resources || cleanup_status=$?
            if [[ "${command_status}" == "0" && "${cleanup_status}" != "0" ]]; then
              command_status="${cleanup_status}"
            fi
            exit "${command_status}"
          }
          trap cleanup_on_exit EXIT

          if docker container inspect "${migration_database}" >/dev/null 2>&1 || \
            docker network inspect "${migration_network}" >/dev/null 2>&1; then
            echo "Refusing to reuse an existing migration schema resource." >&2
            exit 1
          fi

          docker network create --internal \
            --label "${migration_owner_label}=${migration_owner}" \
            "${migration_network}" >/dev/null
          docker run --detach \
            --name "${migration_database}" \
            --label "${migration_owner_label}=${migration_owner}" \
            --network "${migration_network}" \
            --network-alias migration-schema-db \
            --env "POSTGRES_USER=postgres" \
            --env "POSTGRES_PASSWORD=migration-schema-ci-only" \
            --env "POSTGRES_DB=postgres" \
            postgres:17-bookworm >/dev/null

          database_ready=0
          for attempt in $(seq 1 30); do
            if docker exec "${migration_database}" \
              pg_isready --username postgres --dbname postgres >/dev/null 2>&1; then
              database_ready=1
              break
            fi
            [[ "${attempt}" == "30" ]] || sleep 1
          done
          if [[ "${database_ready}" != "1" ]]; then
            docker logs "${migration_database}" >&2
            exit 1
          fi

          docker run --rm --init --network "${migration_network}" \
            --env "ADMIN_ACCESS_TEST_ADMIN_URL=postgresql://postgres:migration-schema-ci-only@migration-schema-db:5432/postgres" \
            --entrypoint npm \
            "${image}" \
            run test:migration-schema:db
          cleanup_owned_migration_resources
          trap - EXIT

          audit_attempts=3
          audit_status=1
          for audit_attempt in $(seq 1 "${audit_attempts}"); do
            if docker run --rm --init --network bridge \
              --entrypoint npm \
              "${image}" \
              audit --omit=dev --ignore-scripts --registry=https://registry.npmjs.org/ \
                --fetch-retries=0 \
                --fetch-timeout=30000; then
              audit_status=0
              break
            fi
            if [[ "${audit_attempt}" != "${audit_attempts}" ]]; then
              sleep $((audit_attempt * 5))
            fi
          done
          [[ "${audit_status}" == "0" ]]
