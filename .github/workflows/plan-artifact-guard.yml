name: Plan artifact guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-plan-artifacts:
    name: Verify plan artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: npm run plans:guard
      - name: Verify goal archives in changed commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA}}"
          head_sha="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          node scripts/plan-commit-archive.mjs verify-history --base "${base_sha}" --head "${head_sha}"
