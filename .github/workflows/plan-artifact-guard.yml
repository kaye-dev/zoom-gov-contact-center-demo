name: Plan artifact guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-plan-artifacts:
    name: Verify plan artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: npm run plans:guard
