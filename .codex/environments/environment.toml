# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "zoom-gov-contact-center-demo"

[setup]
script = '''
if command -v brew >/dev/null 2>&1; then
  node24_prefix="$(brew --prefix node@24 2>/dev/null || true)"
  if [ -n "$node24_prefix" ] && [ -x "$node24_prefix/bin/node" ]; then
    export PATH="$node24_prefix/bin:$PATH"
  fi
fi
node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) { throw new Error(`Node.js 24.x is required; found ${process.version}`); }'
npm ci
./dev-compose.sh prepare
'''

[cleanup]
script = '''
./dev-compose.sh cleanup
'''

[[actions]]
name = "Runtime status"
icon = "tool"
command = '''
./dev-compose.sh status
'''

[[actions]]
name = "App start"
icon = "tool"
command = '''
./dev-compose.sh ensure
'''

[[actions]]
name = "Web restart (explicit)"
icon = "tool"
command = '''
./dev-compose.sh restart web
'''

[[actions]]
name = "Runtime stop"
icon = "tool"
command = '''
./dev-compose.sh stop web studio db
'''

