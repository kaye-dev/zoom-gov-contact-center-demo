<!doctype html>
<html lang="ja" class="light scheme-light h-full antialiased dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー管理 | 未来市 管理画面</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-surface text-fg">
    <div id="users-page" class="min-h-screen bg-surface text-fg">
      <header class="border-b border-line bg-surface-raised">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-4 md:px-6">
          <a href="/" class="text-lg font-bold text-fg transition-colors hover:text-accent">未来市</a>
          <span class="text-sm text-fg-muted">管理画面</span>
          <nav aria-label="管理画面" class="flex w-full flex-wrap items-center gap-2 sm:ml-auto sm:w-auto">
            <div class="relative">
              <button id="users-menu-trigger" type="button" data-admin-menu-trigger aria-expanded="false" aria-controls="admin-users-menu" class="flex cursor-pointer items-center gap-1 whitespace-nowrap rounded-md px-3 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">
                <span>ユーザー管理</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="h-6 w-6 shrink-0" height="24" width="24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M480-360 280-560h400L480-360Z" /></svg>
              </button>
              <ul id="admin-users-menu" hidden class="absolute left-0 top-full z-50 mt-2 min-w-48 overflow-hidden rounded-lg border border-line bg-surface-raised py-1 shadow-lg">
                <li><a href="/admin/users" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-accent transition-colors hover:bg-surface-hover">ユーザー管理</a></li>
                <li><a href="/admin/users/new" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">ユーザー作成</a></li>
                <li><a href="/admin/password-reset-requests" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">再設定申請</a></li>
              </ul>
            </div>
            <div class="relative">
              <button id="settings-menu-trigger" type="button" data-admin-menu-trigger aria-expanded="false" aria-controls="admin-settings-menu" class="flex cursor-pointer items-center gap-1 whitespace-nowrap rounded-md px-3 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">
                <span>設定</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="h-6 w-6 shrink-0" height="24" width="24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M480-360 280-560h400L480-360Z" /></svg>
              </button>
              <ul id="admin-settings-menu" hidden class="absolute right-0 top-full z-50 mt-2 min-w-48 overflow-hidden rounded-lg border border-line bg-surface-raised py-1 shadow-lg">
                <li><a href="/admin/phone-settings" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">電話管理</a></li>
                <li><a href="/admin/chat-settings" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">AIチャット管理</a></li>
                <li><a href="/admin/languages" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">言語管理</a></li>
                <li><a href="/admin/maintenance-settings" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">メンテナンス管理</a></li>
                <li><a href="/admin/roles" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">ロール管理</a></li>
                <li><a href="./developer-api.html" class="block whitespace-nowrap px-4 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover hover:text-accent">Developer API</a></li>
              </ul>
            </div>
            <button type="button" class="cursor-pointer rounded-md border border-line px-3 py-2 text-sm font-semibold text-fg transition-colors hover:bg-surface-hover">ログアウト</button>
          </nav>
        </div>
      </header>
      <main class="mx-auto w-full max-w-7xl px-4 py-8 md:px-6">
        <section class="mx-auto max-w-5xl space-y-6">
          <div class="space-y-2">
            <h1 class="text-2xl font-bold">ユーザー管理</h1>
            <p class="text-sm leading-6 text-fg-muted">管理ユーザーの一覧・詳細を管理します。</p>
          </div>
          <div class="rounded-lg border border-line bg-surface-raised p-5 shadow-sm md:p-6">
            <p class="text-sm text-fg-muted">設定メニューから Developer API を開けます。</p>
          </div>
        </section>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
