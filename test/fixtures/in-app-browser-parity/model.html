<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification model acceptance</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; background: #f5f7fb; color: #172336; }
    :root.dark { color-scheme: dark; background: #111925; color: #eef4ff; }
    body { margin: 0; padding: 24px; }
    main { max-width: 680px; margin: 24px auto; padding: 24px; border: 1px solid #74849b; border-radius: 16px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    button { font: inherit; padding: 10px 16px; cursor: pointer; border: 1px solid #74849b; border-radius: 8px; }
    button:focus-visible { outline: 3px solid #1683f3; outline-offset: 3px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; }
    [role="tooltip"] { margin: 12px 0; padding: 12px; border: 1px solid #74849b; border-radius: 8px; }
    dialog { width: min(360px, calc(100vw - 80px)); padding: 24px; border: 1px solid #74849b; border-radius: 12px; }
    dialog::backdrop { background: #00152f88; }
    dialog h2 { margin-top: 0; }
    #callback-count { font-variant-numeric: tabular-nums; }
    @media (max-width: 519px) { body { padding: 16px; } main { margin: 12px auto; padding: 16px; } }
  </style>
  <script type="module" src="/model-fixture.mjs"></script>
</head>
<body>
  <main id="model-main" data-state="ready">
    <h1 id="consumer-title">Shared control fixture</h1>
    <p id="model-state">ready</p>
    <p id="consumer-copy"></p>
    <div class="controls">
      <button id="dialog-open" type="button">Open dialog</button>
      <button id="help" type="button" aria-describedby="help-text">Help</button>
    </div>
    <p id="help-text" role="tooltip" hidden>Help for this consumer stays readable.</p>
    <p>Confirmed callbacks: <span id="callback-count">0</span></p>
    <dialog id="shared-dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Review change</h2>
      <p id="dialog-copy">Check this consumer before confirming.</p>
      <div class="controls"><button id="dialog-cancel" type="button" autofocus>Cancel</button><button id="dialog-confirm" type="button">Confirm</button></div>
    </dialog>
  </main>
</body>
</html>
