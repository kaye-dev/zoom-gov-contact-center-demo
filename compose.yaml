services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      DATABASE_PATH: /data/app.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - sqlite-data:/data

volumes:
  node_modules:
  sqlite-data:
