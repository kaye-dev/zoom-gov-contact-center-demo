services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: zoom_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoom_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm ci && npm run db:generate && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoom_demo
      BETTER_AUTH_SECRET: local-development-secret-change-me
      BETTER_AUTH_URL: ${WEB_ORIGIN:-http://localhost:${HOST_PORT:-3000}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${WEB_ORIGIN:-http://localhost:${HOST_PORT:-3000}}
      EDGE_CONFIG: ${EDGE_CONFIG:-}
      MAINTENANCE_EDGE_CONFIG_ID: ${MAINTENANCE_EDGE_CONFIG_ID:-}
      MAINTENANCE_EDGE_CONFIG_TEAM_ID: ${MAINTENANCE_EDGE_CONFIG_TEAM_ID:-}
      MAINTENANCE_EDGE_CONFIG_WRITE_TOKEN: ${MAINTENANCE_EDGE_CONFIG_WRITE_TOKEN:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe12345!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Demo Admin}
      NEXT_ALLOWED_DEV_ORIGIN: ${NEXT_ALLOWED_DEV_ORIGIN:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run db:studio:docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoom_demo
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-5555}:5555"

volumes:
  node_modules:
  postgres-data:
