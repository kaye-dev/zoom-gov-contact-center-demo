x-runtime-labels: &runtime-labels
  dev.zoomgov.runtime.id: "${RUNTIME_ID:-local}"
  dev.zoomgov.runtime.checkout: "${RUNTIME_CHECKOUT_PATH:-unknown}"
  dev.zoomgov.runtime.mode: "${RUNTIME_MODE:-local}"
  dev.zoomgov.runtime.config-digest: "${RUNTIME_CONFIG_DIGEST:-unknown}"
  dev.zoomgov.runtime.session-id: "${CODEX_RUNTIME_SESSION_ID:-local-unmanaged}"

services:
  db:
    image: postgres:17-bookworm
    labels: *runtime-labels
    environment:
      POSTGRES_DB: zoom_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoom_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    labels: *runtime-labels
    # Colima の bind mount では Turbopack の polling が変更を取りこぼすため、
    # watchOptions の polling を確実に利用できる webpack で開発サーバーを動かす。
    command: sh -c "npm ci && npm run db:generate && npm run dev -- --webpack --hostname 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoom_demo
      BETTER_AUTH_SECRET: local-development-secret-change-me
      BETTER_AUTH_URL: ${WEB_ORIGIN:-http://localhost:${HOST_PORT:-3000}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${WEB_ORIGIN:-http://localhost:${HOST_PORT:-3000}}
      DEVELOPER_API_SETTINGS_ENCRYPTION_KEY: ${DEVELOPER_API_SETTINGS_ENCRYPTION_KEY:-bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTEyMzQ1Njc4OTA=}
      APP_CANONICAL_ORIGIN: ${WEB_ORIGIN:-http://localhost:${HOST_PORT:-3000}}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe12345!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Demo Admin}
      NEXT_ALLOWED_DEV_ORIGIN: ${NEXT_ALLOWED_DEV_ORIGIN:-}
      NEXT_WATCH_POLL_INTERVAL_MS: "${NEXT_WATCH_POLL_INTERVAL_MS:-1000}"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    labels: *runtime-labels
    command: npm run db:studio:docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoom_demo
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-5555}:5555"

volumes:
  node_modules:
  postgres-data:

networks:
  default:
    labels: *runtime-labels
