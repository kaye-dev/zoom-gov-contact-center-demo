services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: zoom_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoom_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm ci && npm run db:generate && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoom_demo
      BETTER_AUTH_SECRET: local-development-secret-change-me
      BETTER_AUTH_URL: http://localhost:${HOST_PORT:-3000}
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe12345!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Demo Admin}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  postgres-data:
